<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Godzilla</title>
    <style>body{
        display: grid;
        grid-template-columns: 1fr 3fr;
        margin: 0px;
    }
    
    .main{
        display: grid;
        grid-column: 2; 
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 3fr repeat(3, 1fr);
        background-repeat: no-repeat;
        background-position: top;
        justify-content: center;
        background-color: lightgrey;
        height: 100vh;
    }

    .main img {
            grid-column: span 2; /* Изображение занимает две колонки */
            width: 55%; /* Убедитесь, что изображение вписывается */
            height: auto; /* Сохраняет пропорции */
            margin: auto;
        }

    input{
        display: none;
    }
    
    .navi{
        display: grid;
        grid-column: 1; 
        grid-template-rows: 10vh 3vh repeat(4, 1fr) 3fr 1fr;
        row-gap: 10px;
        background-color: black;
        height: 100vh;
    }
    
    .navi > .navi-head-wrapper{
        display: flex;
        justify-content: center;
        background-color: rgb(122, 122, 122);
    }
    
    .navi-head{
        color: white;
    }
    
    .navi-head > span{
        color: black;
    }

    .menu-toggle {
        display: none; /* Прячем кнопку на больших экранах */
        position: absolute;
        top: 10px;
        left: 10px;
        background: none;
        border: none;
        font-size: 24px;
        color: black;
        cursor: pointer;
        z-index: 101;
    }
    
    button.navi-button{
        margin: 10px;
        background-color: rgb(122, 122, 122);
        border-radius: 15px;
        color: white;
    }
    
    .main-head {
            grid-column: span 2; 
            text-align: center;
            margin: 20px 0;
        }

    #upload-button{
        position: relative;
        grid-column: 1;
        margin: 0px 200px;
    }
    
    #open-man-button{
        background-color: black;
        color: white;
        grid-column: 2;
        position: relative;
        margin: 0px 200px;
    }

        /* Адаптация для мобильных устройств */
        @media (max-width: 768px) {
            .main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh; /* Высота занимает весь экран */
            padding: 0;
            margin: 0;
        }

        .main img {
            width: 60%; /* Изображение занимает всю ширину */
            height: 60%; /* Изображение растягивается по высоте */
            object-fit: cover; /* Картинка сохраняет пропорции и заполняет экран */
        }

        .main-head, #upload-button, #open-man-button {
            display: none; /* Скрыть элементы, чтобы оставить только изображение */
        }
        
        body {
            grid-template-columns: 1fr;
        }

        .menu-toggle {
            display: block; /* Показываем кнопку меню */
        }

        .navi {
            position: absolute;
            top: 0;
            left: 0;
            width: 250px;
            height: 100%;
            transform: translateX(-100%); /* Прячем меню за пределы экрана */
        }

        .navi.show {
            transform: translateX(0); /* Выдвигаем меню */
        }
    }
    
 </style>    
</head>

<body>
    <button class="menu-toggle" onclick="toggleMenu()">☰</button>

    <div class="navi">
        <div class="navi-head-wrapper">
            <h2 class="navi-head">
                <span>GO</span>dzilla
            </h2>
        </div>

    
        <div class="empty-cell"></div>
        <button class="navi-button"><b>Главная</b></button>
        <button class="navi-button"><b>Обрезка видео</b></button>
        <button class="navi-button"><b>Выделение игровой доски</b></button>
        <button class="navi-button"><b>Получение SGF файла</b></button>
        <div class="empty-cell"></div>
        <button class="navi-button"><b>Справка</b></button>
    </div>

    <div class="main">
        <img src="static/Godzilla_cut_transparent.png" alt="Godzilla" class="main-image">
        <h1 class = "main-head">Добро пожаловать в сервис Godzilla!</h1>
        <input type="file" id="video-input" class="video-input" accept="video/*">
        <button id="upload-button">Загрузить видео</button>
        <button id="open-man-button">Открыть справку</button>
    </div>
    <script src="static/script.js"></script>
    <script>
        function toggleMenu() {
            const navi = document.querySelector('.navi');
            navi.classList.toggle('show');
        }
    </script>
</body>
</html>
